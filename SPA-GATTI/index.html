    <!DOCTYPE html>
<html>
    <head>
        <title>gatti casuali</title>
        <style>
            .centrato{
                text-align: center;
            }
            #gatto-casuale{
                height: 420px;

            }
            button{
                font-size: 24px;
                background-color: aquamarine;
                padding: 6px;
                border-radius: 6px;
                color:white;
                border: 1px solid black;
            }
            /*cambai il css quando vai sopra con il mouse*/
            #bottone-ricarica:hover{
                border: 3px solid purple;
            }
            #gatti-salvati{
                display: flex;
                justify-content: space-around;
                flex-wrap: wrap;/*quando arriva alllo spazio massimo occupato vai a capo*/
            }
            #gatti-salvati{
                height: 100px;
                margin: 10px;
            }
        </style>
    </head>

    <body>
        <div class="centrato">
            <button id="bottone-ricarica">Ricarica gatto</button></br></br>
            <button id="bottone-salva">salva gatto</button></br></br>
            <img id="gatto-casuale"src="" alt="gatto casuale">
        </div>

        <div id="gatti-salvati"></div>
        

        <script>
            const immagine = document.getElementById("gatto-casuale");// crea collegamento tra il dom e javascript
            const bottone = document.getElementById("bottone-ricarica"); // crea collegamento tra il dom e javascript
            const bottoneSalva = document.getElementById("bottone-salva");
            const salvati = document.getElementById("gatti-salvati");


            let arrayGatti = [];



            //riciesta http
            async function getRandomCat(){
                const url = "https://cataas.com/cat?json=true";

                try{
                    const response = await fetch(url);
                    if(response.ok){
                        const cat = await response.json();
                        immagine.src = cat.url;
                    }
                }catch(e){
                    console.log(e.message);
                }
            }

            bottone.addEventListener("click", () => {
                getRandomCat();
            });

            bottoneSalva.addEventListener("click", () => {

                arrayGatti.push(immagine.src);

                renderizzaGatti();
                
            });

            function renderizzaGatti(){
                salvati.innerHTML = "";// svuotiamo il div
                for(let i=0; i < arrayGatti.length; i++){
                    const nuovoGatto = document.createElement("img");
                    nuovoGatto.src = arrayGatti[i];
                    salvati.appendChild(nuovoGatto);
                }
            }



            getRandomCat();
        </script>
    </body>
</html>
